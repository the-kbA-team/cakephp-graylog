# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modernized:
    name: Modernized PHP ${{ matrix.php_version }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.1', '8.5']
        dependencies: ['default', 'lowest']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: intl, mbstring
          tools: composer:v2
      - name: Validate Composer configuration
        run: make validate QA_NATIVE=1 PHP_VERSION=${{ matrix.php_version }}
      - name: Install, test and audit
        run: make check QA_NATIVE=1 PHP_VERSION=${{ matrix.php_version }} DEPENDENCIES_LOWEST=${{ matrix.dependencies == 'lowest' && '1' || '0' }}

  # Composer config validation
  composer:
    name: Composer config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate composer.json
        run: composer validate --strict

  # PHP syntax validation
  php:
    name: PHP syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PHP syntax
        run: php -l src/ tests/

  phpunit:
    name: PHPUnit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [ '8.1', '8.2' ]
    steps:
      - uses: actions/checkout@v7
      - uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php_version }}
          php_extensions: intl

      - run: vendor/bin/phpunit

  # phpstan for several php versions
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [ '8.1', '8.2' ]
    steps:
      - uses: actions/checkout@v7
      - uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php_version }}
          php_extensions: intl
      - name: PHPStan Static Analysis
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php_version }}
          configuration: phpstan.neon
